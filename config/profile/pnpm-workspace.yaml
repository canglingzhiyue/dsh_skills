allowBuilds:
  "dsh-think-zh@https://codeload.github.com/Len7183/DSH-Think-zh/tar.gz/06a27f64218e7c9367d502fe0f7b90cb8e17ed7a": true
minimumReleaseAgeExclude:
  - '@liustack/modsearch@5.10.3'
