# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ---------------------------------------------------------------------------
# MCP 挂载已移出本层（2026-10-02）—— 见下方说明
# ---------------------------------------------------------------------------
# 这里曾经挂着 4 个 MCP：camoufox / jadx / ida / analyzer。
#
# 为什么移走：挂在本层 = host 层 = `dsh web` 一启动就 spawn 全部 MCP 服务器。
# 实测（2026-10-02）：3 条 stdio 链共 10 个常驻进程、约 300 MB，全部在启动后
# 9~13 秒内拉起；而 `dsh-mcp-client` 的 `apply()` 会**同步等待「连接 + tools/list」
# 完成**才让条目激活，其 Config schema 里没有任何懒加载字段，启动与发现超时又
# 直接继承 MCP SDK 的 60s —— 启动期的卡顿来自这里，且无法靠配置消除。
#
# 移到哪了：agent preset `reverse`（会话选择器里的「逆向模式」），
#   $DSH_HOME\.agent-presets\reverse\agent.cordis.yml
# 为什么这样能按需：preset 是 DSH 里唯一的惰性挂载点 —— `dsh-agent-presets`
# 只在**新会话真的选中该 preset** 时才 compose 它（"reading never mounts"）。
#
# 新行为：`dsh web` 启动与普通会话 → 零 MCP 进程、启动不再等 MCP；
#         新开一个「逆向模式」会话 → 才拉起这 4 台服务器。
# 代价：  普通会话不再有 `mcp__camoufox__*` / `mcp__jadx__*` / `mcp__ida__*` /
#         `mcp__analyzer__*` 工具；开逆向会话时要等它们连上（camoufox 冷启动最慢）。
#
# 想改回常驻：把 `presets\reverse\agent.cordis.yml` 末尾那 4 段（`mcp-camoufox-reverse`
# / `mcp-jadx` / `mcp-ida` / `mcp-anything-analyzer`）整段复制回本文件，按原样包进
# `- insert:` 列表即可 —— 它们就是从这里原封不动搬过去的，只有 analyzer 的
# `headers.Authorization` 从明文 token 改成了 `!!js process.env.ANALYZER_MCP_TOKEN`
# 引用（token 现在在 `$DSH_HOME\.env`）。

# ---------------------------------------------------------------------------
# agent preset「逆向模式」的声明行（2026-10-08 新增；DSH 0.2.0 起必需）
# ---------------------------------------------------------------------------
# **这一段不能删**：DSH 0.2.0 移除了 `.agent-presets\` 的目录扫描，preset 不再是
# "一个会被自动发现的目录"，而必须是 composition 里的一行 `@deepseek-ai/dsh-agent-preset`
# 声明。少了这一行，`presets\reverse\` 即使复制到位也不会出现在会话选择器里
# —— 这正是 2026-10-08 升级后「逆向模式」消失的原因。
#
# 用 `cordis:include` 挂载 `presets\reverse\agent.cordis.yml` 而不是把 400 行内联进来：
#   * composition 保持独立文件，与账本 `presets\reverse\` 一一对应；
#   * include 用 entry-list schema 解析，`!!js` 表达式原样保留、仍在各子行自己的
#     fiber 里求值（analyzer 的 token 引用、platform 判断都照旧）；
#   * 与 `@howmp/dsh-pentest` 适配 0.2.0 后的 `preset-root` 是同一手法。
# 官方 `standard` / `ptc` / `minimal` / `cordis` 四个 preset 在 `dsh-web-app` 的
# `presets\*.patch.yml` 里以同样形状声明，所以这是 DSH 原生机制。
#
# `order` 排在官方之后（standard=1, ptc=2, minimal=3, cordis=4）。preset 声明在启动期
# 装载，改完**必须重启 DSH**才生效。
#
# ⚠️ 换机器：下面的 `file:///C:/Users/y/...` 含本机用户名，新环境要改成自己的
# `$DSH_HOME` 绝对路径（正斜杠、`file:///` 前缀），否则 include 读不到文件、
# preset 会在启动时报错。同理见 `presets\reverse\agent.cordis.yml` 里的 MCP 路径。

- insert:
    - id: preset-reverse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reverse
        name: 逆向模式
        description: 授权目标逆向工程工作流：小程序 / Web / Android 三域现成，iOS 与 Win 预留并按深度降级；开工静默登记授权、能力清单驱动工具选择、产物落纯 ASCII 案件库并按统一验收清单交付。
        order: 5
        plugins:
          - id: reverse-composition
            name: cordis:include
            config:
              path: 'file:///C:/Users/y/.dsh/.agent-presets/reverse/agent.cordis.yml'
