# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: a-lang
    model: deepseek-v4.1-flash
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      claudex:
        displayName: claudex
        apiKeyEnv: CLAUDEX_API_KEY
        api: openai-completions
        baseURL: https://claudex.org/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            # 上下文 1M（2026-10-24 按要求统一调成 1M，与 web profile 保持一致）。
            # ★ 本地声明而非探测结果：deepseek-v4.1-flash 不在 pi-ai catalog 里，
            #   此前走 defaultContextWindow = 262,144（256K）。中转站真实上限未验证。
            contextWindow: 1000000
      a-lang:
        displayName: a-lang
        apiKeyEnv: A_LANG_API_KEY
        api: openai-completions
        baseURL: https://langlangya.dpdns.org/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
      lesec:
        displayName: lesec
        apiKeyEnv: LESEC_API_KEY
        api: openai-completions
        baseURL: https://ai.lesec.top/v1
        models:
          - id: cn:deepseek-v4.1-flash
            name: cn:deepseek-v4.1-flash
            contextWindow: 1000000
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
